services:
  postgres:
    build: ./docker-container-files/postgres
    container_name: home-server-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-container-files/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - home-server-net

  flask:
    build: ./docker-container-files/flask
    container_name: home-server-flask
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${PGHOST}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    ports:
      - "5000:5000"
    networks:
      - home-server-net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: home-server-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker-container-files/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/self-signed.crt:/etc/nginx/certs/self-signed.crt:ro
      - /etc/ssl/private/self-signed.key:/etc/nginx/certs/self-signed.key:ro
    depends_on:
      - flask
    networks:
      - home-server-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  home-server-net:
    driver: bridge
